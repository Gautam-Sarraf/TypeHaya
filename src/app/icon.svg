<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cb23"/>
      <stop offset="100%" stop-color="#d1a307"/>
    </linearGradient>
  </defs>
  <!-- Background rounded keycap -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Subtle top highlight -->
  <rect x="2" y="2" width="60" height="20" rx="13" fill="#ffffff" opacity="0.15"/>

  <!-- Keyboard inner frame -->
  <rect x="9" y="14" width="46" height="36" rx="7" fill="#202225"/>
  
  <!-- Row 1 keys -->
  <rect x="14" y="19" width="6" height="6" rx="1.5" fill="#f5cb23"/>
  <rect x="23" y="19" width="6" height="6" rx="1.5" fill="#f5cb23"/>
  <rect x="32" y="19" width="6" height="6" rx="1.5" fill="#f5cb23"/>
  <rect x="41" y="19" width="8.5" height="6" rx="1.5" fill="#d1d0c5"/>
  
  <!-- Row 2 keys -->
  <rect x="14" y="28" width="7.5" height="6" rx="1.5" fill="#d1d0c5"/>
  <rect x="24.5" y="28" width="6" height="6" rx="1.5" fill="#f5cb23"/>
  <rect x="33.5" y="28" width="6" height="6" rx="1.5" fill="#f5cb23"/>
  <rect x="42.5" y="28" width="7" height="6" rx="1.5" fill="#f5cb23"/>
  
  <!-- Spacebar row -->
  <rect x="14" y="37" width="6" height="6" rx="1.5" fill="#646669"/>
  <rect x="23" y="37" width="18" height="6" rx="2" fill="#f5cb23"/>
  <rect x="44" y="37" width="5.5" height="6" rx="1.5" fill="#646669"/>
</svg>
